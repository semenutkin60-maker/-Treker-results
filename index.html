            <ul class="sidebar__nav">
                <li class="sidebar__item sidebar__item--active"><a href="/"></a>главая</li>

        <main class="main-content">

                    <span class="main-content__card-badge">успех</span>
                </h4>

                <progress class="main-content__progress" value="85" max="100"></progress>
            </div> -->

            <div class="hero__content">
            <div class="hero__icon">🎯</div>
                <h1 class="hero__title">

                <p class="hero__subtitle">

                <div class="hero__divider"></div>

                    <div class="hero__stat">

                    <div class="hero__stat">

                <button class="hero__btn">Начать трекинг →</button>
